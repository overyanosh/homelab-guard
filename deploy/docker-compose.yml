services:
  homelab-guard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: localhost/homelab-guard:latest
    container_name: homelab-guard
    restart: unless-stopped
    # Rootless Podman: map container uid 10001 (user "guard") to the host user
    # so it can read the Podman socket owned by the host user.
    userns_mode: "keep-id:uid=10001,gid=10001"
    security_opt:
      - no-new-privileges:true
      - label=disable
    ports:
      - "9015:9015"
    labels:
      guard.enable: "true"
      guard.group: "platform"
      guard.update.mode: "notify"
      guard.update.schedule: "0 4 * * *"
      guard.test.strategy: "healthcheck"
      guard.test.timeout: "120s"
      guard.ai.context: "Console Homelab Guard : API/UI sur 9015 + worker IA sur 8001."
      guard.backup.pre-update: "false"
    environment:
      - TZ=Europe/Paris
      - MASTER_KEY=${MASTER_KEY}
      # Optional OIDC login gate — leave unset to disable authentication:
      # - OIDC_ISSUER=https://auth.example.com/realms/homelab
      # - OIDC_CLIENT_ID=homelab-guard
      # - OIDC_CLIENT_SECRET=change-me
      # - OIDC_REDIRECT_URL=http://localhost:9015/auth/callback
      # - OIDC_SCOPES=openid profile email
      # - OIDC_ALLOWED_EMAILS=me@example.com
      # - OIDC_ALLOWED_DOMAINS=example.com
      # - OIDC_SESSION_SECRET=<random 32+ characters>
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AI_BASE_URL=${AI_BASE_URL:-http://host.containers.internal:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-sk-local}
      - AI_MODEL=${AI_MODEL:-qwen2.5-coder:14b}
    volumes:
      - ../data:/data
      # Podman exposes a Docker-compatible API on this socket.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock
    extra_hosts:
      - "host.containers.internal:host-gateway"
