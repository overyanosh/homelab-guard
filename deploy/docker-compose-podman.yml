services:
  homelab-guard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homelab-guard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8443:8443"
    environment:
      - TZ=Europe/Paris
      - MASTER_KEY=${MASTER_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.containers.internal:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-sk-local}
      - AI_MODEL=${AI_MODEL:-qwen2.5-coder:14b}
    volumes:
      - ./data:/data
      - type=volume
        source: docker_socket
        target: /run/podman/podman.sock
        read_only: true
    extra_hosts:
      - "host.containers.internal:host-gateway"
    network_mode: bridge

volumes:
  docker_socket:
